# prod 环境：生产 Redis 地址不做任何硬编码默认值，必须通过环境变量显式注入，
# 防止误连测试/开发 Redis。启动前务必设置：
#   SENTINEL_RULE_REDIS_HOST / SENTINEL_RULE_REDIS_PORT
#   SENTINEL_RULE_REDIS_PASSWORD / SENTINEL_RULE_REDIS_DATABASE
spring.redis.host=${SENTINEL_RULE_REDIS_HOST}
spring.redis.port=${SENTINEL_RULE_REDIS_PORT:6379}
spring.redis.password=${SENTINEL_RULE_REDIS_PASSWORD:}
spring.redis.database=${SENTINEL_RULE_REDIS_DATABASE:1}
spring.redis.timeout=3000
# 本环境 dashboard 端口（8863）
server.port=${SENTINEL_DASHBOARD_PORT:8863}
