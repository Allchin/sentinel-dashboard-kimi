# wms 环境：与 kimigoshop-tms wms profile 的 Sentinel 规则 Redis 一致
# （TMS application-wms.properties: tms.sentinel.rule.* = 192.168.110.254:6379 db1 无密码）
spring.redis.host=${SENTINEL_RULE_REDIS_HOST:192.168.110.254}
spring.redis.port=${SENTINEL_RULE_REDIS_PORT:6379}
spring.redis.password=${SENTINEL_RULE_REDIS_PASSWORD:}
spring.redis.database=${SENTINEL_RULE_REDIS_DATABASE:1}
spring.redis.timeout=3000
# 本环境 dashboard 端口（8861）
server.port=${SENTINEL_DASHBOARD_PORT:8861}
